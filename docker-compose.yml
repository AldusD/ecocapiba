version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: ecocapiba_db_local
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: user_docker
      POSTGRES_PASSWORD: password_docker
      POSTGRES_DB: ecocapiba_local
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: